<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - StudyAI</title>
</head>
<body>
  <h1>Connexion StudyAI</h1>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mot de passe">

  <button onclick="inscription()">Créer un compte</button>
  <button onclick="connexion()">Se connecter</button>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "COLLE_ICI_TON_PROJECT_URL";
    const SUPABASE_ANON_KEY = "COLLE_ICI_TA_ANON_KEY";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function inscription() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        document.getElementById("message").innerText = error.message;
      } else {
        document.getElementById("message").innerText = "Compte créé avec succès.";
      }
    }

    async function connexion() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        document.getElementById("message").innerText = error.message;
      } else {
        window.location.href = "dashboard.html";
      }
    }
  </script>
</body>
</html>
